<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ellie Madsen</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="image/e.png" />
  </head>
  <body>
    <div class="outer">
      <aside class="sidebar" id="project-info"></aside>

      <main class="content">
        <div class="close-button" onclick="window.history.back()">x</div>
        <div id="project-content"></div>
      </main>
    </div>

    <script>
      fetch("projects.json")
        .then((res) => res.json())
        .then((data) => {
          const id = new URLSearchParams(window.location.search).get("id");
          const project = data.find((p) => p.id === id);

          document.getElementById("project-info").innerHTML = `
            <div class="project-sidebar-content">
              <p class="title">${project.title}</p>


              <div>
                <p class="subtitle">Year</p>
                <p>${project.year}</p>
              </div>

              ${
                project.link
                  ? `<div>
                <p class="subtitle">Project Website</p>
                <a href="${project.link}" target="_blank">${project.link
                  .replace("https://", "")
                  .replace(/\//g, "/<wbr>")}</a>
              </div>`
                  : ""
              }

              ${
                project.github
                  ? `<div>
                <p class="subtitle">Code Repository</p>
                <a href="${project.github}" target="_blank">${project.github
                  .replace("https://", "")
                  .replace(/\//g, "/<wbr>")}</a>
              </div>`
                  : ""
              }

              <div>
                <p class="subtitle">Methods</p>
                <p>${project.category.join(", ")}</p>
              </div>

              ${
                project.partner
                  ? `<div>
                <p class="subtitle">Partner</p>
                <p>${project.partner}</p>
              </div>`
                  : ""
              }

              <img src="${project.cover}" style="width:100%;">
            </div>
      `;

          // re add this for the tools
          //       ${
          //   project.tools && project.tools.length > 0
          //     ? `<div>
          //   <p class="subtitle">Tools</p>
          //   <p>${project.tools.join(", ")}</p>
          // </div>`
          //     : ""
          // }

          fetch(`projects/${project.id}.html`)
            .then((res) => res.text())
            .then((html) => {
              const container = document.getElementById("project-content");
              container.innerHTML = html;
              // innerHTML doesn't execute scripts — re-create each one so they run
              Array.from(container.querySelectorAll("script")).forEach(
                (oldScript) => {
                  const newScript = document.createElement("script");
                  Array.from(oldScript.attributes).forEach((attr) =>
                    newScript.setAttribute(attr.name, attr.value),
                  );
                  newScript.textContent = oldScript.textContent;
                  oldScript.parentNode.replaceChild(newScript, oldScript);
                },
              );
            });
        });
    </script>
  </body>
</html>
